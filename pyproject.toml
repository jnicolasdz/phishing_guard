[project]
name = "phishing-langgraph-lab"
version = "0.1.0"
description = "Laboratory email phishing detection pipeline using LangGraph, a local Ollama model, IMAP and SQLite"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.60",
  "langchain-core>=0.3.0",
  "langchain-ollama>=0.2.0",
  "pydantic>=2.8.0",
  "imapclient>=3.0.1",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
phishing-guard = "phishing_guard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
